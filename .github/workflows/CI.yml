name: Build modules

on:
  push:
    paths-ignore:
      - "**/*.md"
      - '**/*.txt'
  workflow_dispatch:

jobs:
  build_prx:
    runs-on: ubuntu-latest
    steps:

    - name: Checkout
      uses: actions/checkout@main
      with:
        fetch-depth: 0
        submodules: recursive

    - name: Checkout SDK
      uses: actions/checkout@main
      with:
        repository: GoldHEN/GoldHEN_Plugins_SDK
        path: SDK

    - name: Checkout mxml
      uses: actions/checkout@main
      with:
        repository: illusion0001/mxml
        ref: clang-14
        path: mxml

    - name: Setup variables
      run: |
        sudo apt-get update && sudo apt-get install -y llvm lld wget
        echo "OO_PS4_TOOLCHAIN=$GITHUB_WORKSPACE/OpenOrbis/PS4Toolchain" >> $GITHUB_ENV

    - name: Download OpenOrbis Toolchain
      run: |
        mkdir -p OpenOrbis
        wget -q https://github.com -O toolchain.zip
        unzip -q toolchain.zip -d OpenOrbis

    - name: Install mini xml
      working-directory: mxml/ps4
      run: |
        wget -q https://githubusercontent.com -O $OO_PS4_TOOLCHAIN/build_rules.mk
        make install PRX_BUILD=1

    - name: Export path to SDK
      working-directory: SDK
      run: echo "GOLDHEN_SDK=$(pwd)" >> $GITHUB_ENV

    - name: Build (Release)
      run: make

    - name: Upload PRX
      uses: actions/upload-artifact@v4
      with:
        name: ps4-mod-menu
        path: bin/plugins/prx_final/*.prx
